server:
  port: 8080

spring:
  application:
    name: pqc-auth-spring-boot
  # Postgres (e.g. RDS in AWS). Override via env vars in every real deployment;
  # the jdbc:postgresql://localhost defaults only support local dev.
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/pqcauth}
    username: ${SPRING_DATASOURCE_USERNAME:pqcauth}
    password: ${SPRING_DATASOURCE_PASSWORD:pqcauth}
    driver-class-name: org.postgresql.Driver
  jpa:
    open-in-view: false
    hibernate:
      # Demo-appropriate: auto-creates/updates app_users, app_user_roles,
      # pqc_signing_keys from the entities. A managed deployment should
      # switch to a migration tool (Flyway/Liquibase) and set this to "validate".
      ddl-auto: update

# PQC token authentication settings.
# Algorithm choices map directly onto the benchmarked schemes in
# "The Energy Cost of Post-Quantum Transition: Benchmarking PQC Algorithms on
# Commodity Hardware" (Jindal, Judd & Uludag, HPDC '26):
#   ML_DSA_44 / ML_DSA_65 / ML_DSA_87   -> lattice-based, paper's recommended default (Table 9)
#   FALCON_512 / FALCON_1024            -> lattice-based, compact sigs / fast verify, expensive keygen
#   SPHINCS_PLUS_SHA2_128F / _256F      -> hash-based, conservative assumptions, large/slow signatures
pqc:
  algorithm: ML_DSA_87
  token-ttl-seconds: 900
  issuer: pqc-auth-demo
  key-id: pqc-auth-key-1

management:
  endpoints:
    web:
      exposure:
        include: health,info

logging:
  level:
    com.example.pqcauth: INFO
